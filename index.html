<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TIP</title>
<meta name="description" content="TIP workout app: generated workouts, programs, guided stretching and progressive overload tracking.">
<meta name="theme-color" content="#1E4ED8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="TIP">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: one-column coach (max 760px), bottom tab bar, animated figures lead every item; text kept to labels and one-line cues */
:root{
  --bg:#F1F3F2; --surface:#FFFFFF; --surface-2:#E6EAE8; --line:#D2D8D5;
  --ink:#141819; --muted:#56615C; --fig-far:#9BA7A1;
  --accent:#1E4ED8; --accent-ink:#FFFFFF; --accent-soft:#E1E8FB;
  --good:#1B7A45; --on-good:#FFFFFF; --good-soft:#DCF0E3;
  --warn:#8F5200; --warn-soft:#FAEBD3;
  --bad:#B42318; --bad-soft:#F9E0DD;
  --pr:#7D5C00; --pr-soft:#FBF0C8;
  --scrim:rgb(15 18 20 / .45);
  --shadow:0 8px 24px rgb(20 24 25 / .18);
  --display:"Barlow Condensed","Arial Narrow","Roboto Condensed",system-ui,sans-serif;
  --body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1214; --surface:#171B1E; --surface-2:#21262A; --line:#30373C;
  --ink:#E8ECEA; --muted:#9AA5A0; --fig-far:#5E6964;
  --accent:#7598FF; --accent-ink:#0A1128; --accent-soft:#1B2547;
  --good:#5CC88A; --on-good:#08170E; --good-soft:#14291C;
  --warn:#EBAA55; --warn-soft:#2E2312;
  --bad:#FF8177; --bad-soft:#36191A;
  --pr:#E9C553; --pr-soft:#2C2610;
  --scrim:rgb(0 0 0 / .6);
  --shadow:0 8px 24px rgb(0 0 0 / .5);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1214; --surface:#171B1E; --surface-2:#21262A; --line:#30373C;
  --ink:#E8ECEA; --muted:#9AA5A0; --fig-far:#5E6964;
  --accent:#7598FF; --accent-ink:#0A1128; --accent-soft:#1B2547;
  --good:#5CC88A; --on-good:#08170E; --good-soft:#14291C;
  --warn:#EBAA55; --warn-soft:#2E2312;
  --bad:#FF8177; --bad-soft:#36191A;
  --pr:#E9C553; --pr-soft:#2C2610;
  --scrim:rgb(0 0 0 / .6);
  --shadow:0 8px 24px rgb(0 0 0 / .5);
  color-scheme:dark}
*{box-sizing:border-box}
html{background:var(--bg)}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0 calc(100px + env(safe-area-inset-bottom,0px))}
body.playing #tabs,body.playing #timer{display:none}
#app{max-width:760px;margin:0 auto;padding-block:18px 24px;display:flex;flex-direction:column;gap:16px}
h1,h2,h3{font-family:var(--display);margin:0;line-height:1.08;text-wrap:balance}
h1{font-size:clamp(32px,8vw,42px);font-weight:700;text-transform:uppercase;letter-spacing:.01em}
h2{font-size:21px;font-weight:700;text-transform:uppercase;letter-spacing:.04em}
h3{font-size:20px;font-weight:600}
p{margin:0}
.eyebrow{font-size:11.5px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:600}
.muted{color:var(--muted)}
.small{font-size:13px}
.num{font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:9px 14px;font-weight:600;min-height:44px;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--accent);padding-inline:8px}
.btn.danger{color:var(--bad)}
.btn.wide{width:100%;min-height:56px;font-size:17px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.icon-btn{width:44px;height:44px;border-radius:10px;border:1px solid var(--line);background:var(--surface);display:inline-grid;place-items:center;padding:0;flex:none}
.icon-btn svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.link{background:none;border:0;padding:4px 2px;color:var(--accent);font-weight:600;font-size:13px;min-height:32px}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.page-head .right{display:flex;gap:8px;align-items:center}
.back{align-self:flex-start;margin-bottom:-8px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:14px;min-width:0}
.row-between{display:flex;justify-content:space-between;align-items:center;gap:8px 12px;flex-wrap:wrap}
.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;padding:2px 9px;border-radius:999px;background:var(--surface-2);color:var(--muted);white-space:nowrap;line-height:1.6}
.chip.good{background:var(--good-soft);color:var(--good)}
.chip.accent{background:var(--accent-soft);color:var(--accent)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.bad{background:var(--bad-soft);color:var(--bad)}
.chip.pr{background:var(--pr-soft);color:var(--pr)}
.note{border-radius:10px;padding:12px 14px;background:var(--warn-soft);font-size:14px;display:flex;flex-direction:column;gap:8px}
.note.info{background:var(--accent-soft)}
.note.bad{background:var(--bad-soft)}
/* figures */
svg.fig{display:block;width:100%;height:auto;overflow:visible}
.fig .gnd{stroke:var(--line);stroke-width:1.5}
.fig .b{stroke:var(--ink);stroke-width:5;stroke-linecap:round;stroke-linejoin:round;fill:none}
.fig .b.t{stroke-width:6.5}
.fig .b.far{stroke:var(--fig-far)}
.fig .hd{fill:var(--ink)}
.fig .p{fill:var(--accent)}
.fig .p.far{fill:var(--fig-far)}
.fig .pl{stroke:var(--accent);stroke-width:1.8;fill:none}
.fig .pb{stroke:var(--muted);stroke-width:2.6;fill:none;stroke-linecap:round}
.fig .pbf{fill:var(--muted)}
.fig .bd{stroke:var(--accent);stroke-width:1.8;stroke-dasharray:3 2.5;fill:none}
.figbox{background:var(--surface-2);border-radius:10px;padding:4px;flex:none}
.eqi{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
/* pickers */
.tile-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:8px}
.tile{border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:6px 6px 8px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:13px;font-weight:600;min-height:44px}
.tile svg.fig{width:100%;max-width:84px}
.tile[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.tg{display:inline-flex;align-items:center;gap:6px;border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:14px;font-weight:600;min-height:40px}
.tg[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.tg.fixed{opacity:.7;cursor:default}
.seg{display:flex;gap:6px}
.seg button{flex:1;min-height:44px;border:1px solid var(--line);background:var(--surface);border-radius:8px;font-family:var(--display);font-size:20px;font-weight:600}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.seg button small{font-family:var(--body);font-size:11px;font-weight:500;opacity:.75;margin-left:2px}
.seg-wrap{display:flex;flex-direction:column;gap:6px}
.seg-legend{display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}
.field-label{display:flex;align-items:center;gap:8px}
/* item rows */
.items{display:flex;flex-direction:column;gap:8px}
.block-label{display:flex;align-items:center;gap:8px;margin-top:4px}
.item{display:grid;grid-template-columns:72px minmax(0,1fr) auto;gap:12px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:6px 8px 6px 6px;background:var(--surface)}
.item .figbox{width:72px}
.item-name{background:none;border:0;padding:0;text-align:left;font-weight:600;font-size:15px;line-height:1.25}
.item-sub{display:block;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.item-acts{display:flex;gap:6px}
.item-acts .icon-btn{width:40px;height:40px}
.sum-line{display:flex;gap:14px;flex-wrap:wrap;font-size:14px;color:var(--muted)}
.sum-line b{color:var(--ink);font-family:var(--display);font-size:22px;margin-right:3px}
.sticky-cta{position:sticky;bottom:calc(82px + env(safe-area-inset-bottom,0px));z-index:5}
/* exercise card */
.ex-head{display:grid;grid-template-columns:76px minmax(0,1fr) auto;gap:12px;align-items:center}
.ex-head .figbox{width:76px}
.ex-title{min-width:0}
.meta{display:block;margin-top:2px;font-size:13px;color:var(--muted)}
.prev{display:flex;flex-direction:column;gap:2px;font-size:15px}
.prline{font-size:13px;color:var(--pr);font-weight:600}
.rx{display:flex;flex-wrap:wrap;align-items:center;gap:4px 10px;padding:10px 12px;background:var(--surface-2);border-radius:8px}
.rx strong{font-family:var(--display);font-size:20px;font-weight:600;letter-spacing:.01em}
.sets{display:flex;flex-direction:column}
.set{display:grid;grid-template-columns:22px minmax(0,1fr) 58px 50px;gap:6px;align-items:center;padding:10px 0 2px;border-top:1px solid var(--line)}
.set-n{font-family:var(--display);font-size:20px;font-weight:700;color:var(--muted);text-align:center}
.set.is-done .set-n{color:var(--good)}
.fields{display:flex;flex-wrap:wrap;gap:6px;min-width:0}
.stepper{display:grid;grid-template-columns:30px 46px 30px;height:54px;border:1px solid var(--line);border-radius:8px;background:var(--surface-2);overflow:hidden}
.stepper button{border:0;background:transparent;font-size:20px;font-weight:600;color:var(--muted);padding:0}
.stepper button:active{background:var(--line)}
.stepper .mid{display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--surface);border-inline:1px solid var(--line);cursor:text}
.stepper input{width:100%;border:0;background:transparent;text-align:center;font-family:var(--display);font-size:23px;font-weight:600;padding:0;color:var(--ink);font-variant-numeric:tabular-nums;line-height:1.1}
.stepper input::placeholder{color:var(--muted);opacity:.7}
.stepper input:focus{outline:none}
.stepper .mid:focus-within{box-shadow:inset 0 0 0 2px var(--accent)}
.stepper .cap{font-size:9.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);line-height:1;white-space:nowrap}
.set.is-done .stepper .mid{background:var(--good-soft)}
.rpe{height:54px;width:100%;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);font:600 15px var(--body);text-align:center;text-align-last:center;padding:0 2px;-webkit-appearance:none;appearance:none}
.play{height:54px;width:100%;border:1px solid var(--accent);border-radius:8px;background:var(--accent-soft);color:var(--accent);font-size:18px;font-weight:700}
.tick{height:54px;width:50px;border-radius:8px;border:1.5px solid var(--line);background:var(--surface);font-size:24px;font-weight:700;color:var(--muted)}
.set.is-done .tick{background:var(--good);border-color:var(--good);color:var(--on-good)}
.set-foot{grid-column:1/-1;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;padding-left:28px;min-height:32px}
.hint{font-size:12.5px;color:var(--muted)}
.hint .pain{color:var(--bad);font-weight:600}
.foot-acts{display:flex;gap:12px}
.set-more{grid-column:1/-1;display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;padding:10px;margin:0 0 8px;background:var(--surface-2);border-radius:8px}
.set-more .wide{grid-column:1/-1}
.card-actions{display:flex;gap:8px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:12px}
.guided{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:12px;background:var(--accent-soft);border-radius:12px;padding:10px 12px}
.guided .figs{display:flex;gap:4px;overflow:hidden}
.guided .figs .figbox{width:48px;background:var(--surface)}
/* forms */
.fld{display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:var(--muted);font-weight:600;min-width:0}
.fld input,.fld select,textarea{font:inherit;font-weight:400;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:9px 10px;min-height:44px;width:100%}
textarea{font-size:13px;font-family:ui-monospace,Menlo,Consolas,monospace;resize:vertical}
.form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.form-grid .wide{grid-column:1/-1}
/* recommendation */
.rec{border:1.5px solid var(--line);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.rec.k-increase,.rec.k-level,.rec.k-addset,.rec.k-longer,.rec.k-assist{border-color:var(--good)}
.rec.k-reduce{border-color:var(--bad)}
.rec-head{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center}
.rec-head strong{font-family:var(--display);font-size:21px;font-weight:600}
details.why summary{cursor:pointer;color:var(--accent);font-weight:600;font-size:13px;min-height:28px;display:inline-flex;align-items:center}
.reasons,.analysis{margin:0;padding-left:18px;font-size:14px;display:flex;flex-direction:column;gap:3px}
.decision{font-size:14px}
.plateau{background:var(--warn-soft);border-radius:10px;padding:12px 14px;font-size:14px;display:flex;flex-direction:column;gap:6px}
.plateau ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px}
/* lists */
.list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.list > li{border-top:1px solid var(--line)}
.list > li:first-child{border-top:0}
.row-btn{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;width:100%;text-align:left;background:none;border:0;padding:8px 2px;min-height:56px}
.row-btn .figbox{width:56px}
.row-btn strong{display:block;font-weight:600}
.row-right{display:flex;align-items:center;gap:10px}
.eq-icons{display:inline-flex;gap:3px;color:var(--muted);vertical-align:middle}
.eq-icons .eqi{width:15px;height:15px}
/* program */
.prog-card{display:grid;grid-template-columns:84px minmax(0,1fr);gap:12px;align-items:center;text-align:left;border:1.5px solid var(--line);background:var(--surface);border-radius:14px;padding:10px;width:100%}
.prog-card .figbox{width:84px}
.prog-card strong{font-family:var(--display);font-size:22px;font-weight:700;text-transform:uppercase;letter-spacing:.02em;display:block;line-height:1.1}
.prog-meta{display:flex;flex-wrap:wrap;gap:4px 6px;margin-top:4px}
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.day{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 2px;border-radius:10px;background:var(--surface-2);font-size:12px;font-weight:600;color:var(--muted);min-height:58px}
.day .dot{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-size:12px}
.day.plan .dot{border-color:var(--accent)}
.day.done .dot{background:var(--good);border-color:var(--good);color:var(--on-good)}
.day.today{outline:2px solid var(--ink);outline-offset:-2px;color:var(--ink)}
button.day{border:0}
button.day[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.bar-track{height:10px;border-radius:5px;background:var(--surface-2);overflow:hidden}
.bar-track i{display:block;height:100%;background:var(--accent);border-radius:5px}
/* charts and stats */
.range{display:flex;gap:4px;flex-wrap:wrap}
.range button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:13px;font-weight:600;min-height:36px}
.range button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.charts{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px}
.chart-card{background:var(--surface-2);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:6px;min-width:0}
.chart-card h3{font-size:15px;font-weight:600;font-family:var(--body)}
svg.chart{width:100%;height:auto;display:block;overflow:visible}
.chart .gd{stroke:var(--line);stroke-width:1}
.chart .ax{fill:var(--muted);font:500 15px var(--body)}
.chart .ln{stroke:var(--accent);stroke-width:3;fill:none;stroke-linejoin:round;stroke-linecap:round}
.chart .ln.est{stroke-dasharray:7 6}
.chart .ar{fill:var(--accent);opacity:.12}
.chart .dt{fill:var(--surface-2);stroke:var(--accent);stroke-width:2.5}
.chart .end{fill:var(--accent)}
.chart .lbl{fill:var(--ink);font:600 17px var(--body)}
.chart .bar{fill:var(--accent);opacity:.8}
.chart .bar.now{opacity:1}
.chart-empty{padding:28px 8px;text-align:center;color:var(--muted);font-size:14px}
.spark{width:96px;height:28px;display:block}
.spark polyline{fill:none;stroke:var(--accent);stroke-width:2;stroke-linejoin:round}
.spark circle{fill:var(--accent)}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (min-width:640px){.tiles{grid-template-columns:repeat(4,minmax(0,1fr))}}
.stat{background:var(--surface-2);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.stat b{font-family:var(--display);font-size:32px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.stat span{font-size:12.5px;color:var(--muted)}
.bars{display:flex;flex-direction:column;gap:8px}
.bar-row{display:grid;grid-template-columns:86px minmax(0,1fr) 30px;gap:10px;align-items:center;font-size:14px}
.bar-row .n{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
.meter{height:12px;background:var(--surface-2);border-radius:6px;position:relative;overflow:hidden}
.meter .band{position:absolute;top:0;bottom:0;background:var(--good-soft)}
.meter i{position:absolute;inset:0 auto 0 0;background:var(--accent);border-radius:6px}
.pr-list{display:flex;flex-direction:column;gap:6px}
.pr-item{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:8px 12px;border-radius:8px;background:var(--pr-soft);font-size:14px}
.pr-item b{font-variant-numeric:tabular-nums}
.cmp{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:0}
.cmp div{background:var(--surface-2);border-radius:8px;padding:10px 12px;min-width:0}
.cmp dt{font-size:11.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.cmp dd{margin:2px 0 0;font-variant-numeric:tabular-nums;font-weight:600}
.status-groups{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.status-groups > div{display:flex;flex-direction:column;gap:4px;align-items:flex-start}
.tbl-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px;font-variant-numeric:tabular-nums}
th{text-align:left;font-size:11.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600;padding:6px 8px;border-bottom:1px solid var(--line)}
td{padding:8px;border-bottom:1px solid var(--line);vertical-align:top}
td .link{min-height:0;padding:0}
.setting{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.seg.small button{flex:0 0 auto;min-width:56px;font-family:var(--body);font-size:15px}
.hero-fig{display:grid;grid-template-columns:minmax(0,180px) minmax(0,1fr);gap:16px;align-items:center}
@media (max-width:460px){.hero-fig{grid-template-columns:1fr}.hero-fig .figbox{max-width:220px}}
/* sheet */
#sheet[hidden]{display:none}
.sheet-bg{position:fixed;inset:0;background:var(--scrim);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:760px;max-height:88vh;overflow:auto;border-radius:18px 18px 0 0;padding:16px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:12px;box-shadow:var(--shadow)}
.sheet-head{display:flex;justify-content:space-between;align-items:center;gap:8px;position:sticky;top:-16px;background:var(--bg);padding-block:4px;z-index:1}
/* player */
.player{min-height:calc(100vh - 40px);display:flex;flex-direction:column;gap:14px;align-items:center;text-align:center;padding-block:8px}
.player .top{width:100%;display:flex;justify-content:space-between;align-items:center;gap:8px}
.player .dots{display:flex;gap:4px;flex-wrap:wrap;justify-content:center;flex:1}
.player .dots i{width:7px;height:7px;border-radius:50%;background:var(--line)}
.player .dots i.on{background:var(--accent)}
.player .dots i.done{background:var(--good)}
.stage{position:relative;width:min(100%,360px)}
.stage .figbox{width:100%;padding:10px}
.ring{width:132px;height:132px;position:relative;display:grid;place-items:center}
.ring svg{position:absolute;inset:0;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:9}
.ring .bgc{stroke:var(--surface-2)}
.ring .fgc{stroke:var(--accent);stroke-linecap:round}
.ring.ready .fgc{stroke:var(--warn)}
.ring b{font-family:var(--display);font-size:44px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1}
.ring span{position:absolute;bottom:26px;font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.pose-name{font-family:var(--display);font-size:30px;font-weight:700;text-transform:uppercase;letter-spacing:.02em;line-height:1.05}
.side-tag{display:inline-block;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;background:var(--ink);color:var(--bg);border-radius:999px;padding:2px 10px}
.player .controls{display:flex;gap:14px;align-items:center;justify-content:center}
.player .controls .icon-btn{width:56px;height:56px;border-radius:50%}
.player .controls .icon-btn.big{width:72px;height:72px;background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.player .controls svg{width:26px;height:26px}
/* brand, splash, tour */
.brand-row{display:flex;align-items:center;gap:10px}
.brand{width:36px;height:36px;border-radius:9px;display:block;flex:none}
#splash{position:fixed;inset:0;z-index:100;background:#1E4ED8;display:grid;place-items:center;transition:opacity .35s ease}
#splash.out{opacity:0}
.splash-in{display:flex;flex-direction:column;align-items:center;gap:6px}
.logo-anim{width:min(52vw,220px);height:auto;overflow:visible}
.splash-word{font-family:var(--display);font-weight:700;font-size:20px;letter-spacing:.42em;text-transform:uppercase;color:#FFFFFF;opacity:.85;margin-left:.42em}
@media (prefers-reduced-motion:no-preference){
  .logo-anim .lt,.logo-anim .lp,.logo-anim .lbar,.logo-anim .lpl{transform-box:fill-box;transform-origin:center}
  .logo-anim .lt{animation:rise .45s .1s cubic-bezier(.2,.8,.2,1) both}
  .logo-anim .lp{animation:rise .45s .22s cubic-bezier(.2,.8,.2,1) both}
  .logo-anim .lbar{animation:grow .3s .42s ease-out both}
  .logo-anim .lpl-t{animation:dropT .42s .66s cubic-bezier(.3,1.5,.5,1) both}
  .logo-anim .lpl-b{animation:dropB .42s .66s cubic-bezier(.3,1.5,.5,1) both}
  .logo-anim{animation:rep .5s 1.08s ease-in-out both}
  .splash-word{animation:fadeup .5s .9s ease-out both}
  @keyframes rise{from{opacity:0;transform:translateY(60px)}}
  @keyframes grow{from{transform:scaleY(0)}}
  @keyframes dropT{from{opacity:0;transform:translateY(-140px)}}
  @keyframes dropB{from{opacity:0;transform:translateY(140px)}}
  @keyframes rep{50%{transform:translateY(-10px) scale(1.04)}}
  @keyframes fadeup{from{opacity:0;transform:translateY(8px)}}
  .onb-slide{animation:fadeup .3s ease-out both}
}
#onb{position:fixed;inset:0;z-index:90;background:var(--bg);overflow:auto;
  padding:calc(16px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.onb{max-width:480px;min-height:100%;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.onb-top{display:flex;justify-content:space-between;align-items:center}
.onb-slide{flex:1;display:flex;flex-direction:column;align-items:center;text-align:center;gap:14px;justify-content:center}
.onb-slide .figbox{width:min(70vw,240px);padding:10px}
.onb-slide h1{font-size:clamp(32px,9vw,44px)}
.onb-slide p{font-size:17px;max-width:34ch}
.onb-demo{width:100%;display:flex;flex-direction:column;gap:10px;align-items:center}
.onb-mock{pointer-events:none;width:100%;max-width:360px;text-align:left}
.onb-pair{display:flex;gap:10px;justify-content:center}
.onb-pair .figbox{width:120px}
.stepper .v{font-family:var(--display);font-size:23px;font-weight:600;line-height:1.1}
.onb-dots{display:flex;gap:6px;justify-content:center}
.onb-dots i{width:8px;height:8px;border-radius:50%;background:var(--line)}
.onb-dots i.on{background:var(--accent);width:22px;border-radius:4px}
.onb-foot{display:flex;flex-direction:column;gap:12px}
.onb-foot .actions{justify-content:space-between}
/* chrome */
#tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);
  padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px));display:flex;justify-content:center}
#tabs .inner{display:grid;grid-template-columns:repeat(4,1fr);max-width:520px;width:100%;gap:4px}
#tabs a{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 4px;border-radius:8px;text-decoration:none;color:var(--muted);font-size:12px;font-weight:600;min-height:50px}
#tabs svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
#tabs a[aria-current="page"]{color:var(--accent);background:var(--accent-soft)}
#timer{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(78px + env(safe-area-inset-bottom,0px));z-index:21;background:var(--ink);color:var(--bg);border:0;border-radius:999px;padding:10px 18px;font-family:var(--display);font-size:19px;font-weight:600;display:flex;gap:12px;align-items:center;box-shadow:var(--shadow);white-space:nowrap;font-variant-numeric:tabular-nums}
#timer.ready{background:var(--good);color:var(--on-good)}
#timer.hold{background:var(--accent);color:var(--accent-ink)}
#timer small{font-family:var(--body);font-size:12px;opacity:.85;font-weight:500}
#toast{position:fixed;left:50%;transform:translateX(-50%);top:calc(12px + env(safe-area-inset-top,0px));z-index:60;background:var(--ink);color:var(--bg);border-radius:8px;padding:10px 16px;font-size:14px;font-weight:600;box-shadow:var(--shadow);max-width:calc(100% - 32px)}
@media (prefers-reduced-motion:no-preference){#toast{animation:drop .2s ease-out}@keyframes drop{from{transform:translate(-50%,-8px);opacity:0}}}

/* standalone page reset (the artifact host supplied this before) */
:root{padding-top:env(safe-area-inset-top,0px)}
body{margin:0;-webkit-tap-highlight-color:transparent}
img{max-width:100%}
[hidden]{display:none!important}
</style>

<body>
<div id="app"></div>
<div id="sheet" hidden></div>
<div id="onb" hidden></div>
<div id="splash" hidden aria-hidden="true"></div>
<button id="timer" type="button" data-act="dismissTimer" hidden></button>
<div id="toast" role="status" hidden></div>
<nav id="tabs" aria-label="Sections"><div class="inner">
  <a href="#train" data-act="tab" data-tab="train"><svg viewBox="0 0 24 24"><path d="M3 9v6M6 6v12M18 6v12M21 9v6M6 12h12"/></svg>Train</a>
  <a href="#plans" data-act="tab" data-tab="plans"><svg viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 10h16M9 3v4M15 3v4"/></svg>Plans</a>
  <a href="#stretch" data-act="tab" data-tab="stretch"><svg viewBox="0 0 24 24"><circle cx="12" cy="4.5" r="2"/><path d="M12 7v6M5 9l7 2 7-2M12 13l-5 7M12 13l5 7"/></svg>Stretch</a>
  <a href="#progress" data-act="tab" data-tab="progress"><svg viewBox="0 0 24 24"><path d="M4 19V5M4 19h16M8 15l4-4 3 3 5-6"/></svg>Progress</a>
</div></nav>

<script>
'use strict';
/* ================= utilities ================= */
const KEY='setbyset.v2', KEY1='setbyset.v1', BAK='setbyset.v2.backup', DAY=864e5;
const uid=()=>Math.random().toString(36).slice(2,9)+(Date.now()%1e7).toString(36);
const clone=o=>JSON.parse(JSON.stringify(o));
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num=v=>(v===''||v==null||Number.isNaN(+v))?null:+v;
const r2=v=>Math.round(v*100)/100;
const r1=v=>Math.round(v*10)/10;
const sum=a=>a.reduce((x,y)=>x+(+y||0),0);
const max=a=>a.length?Math.max(...a):0;
const fmtN=v=>v==null?'':String(r2(v));
const fmtK=v=>Math.round(v).toLocaleString();
const roundTo=(v,inc)=>r2(Math.round(v/inc)*inc);
const sod=ts=>{const d=new Date(ts);d.setHours(0,0,0,0);return d.getTime()};
const weekStart=ts=>{const d=new Date(sod(ts));d.setDate(d.getDate()-((d.getDay()+6)%7));return d.getTime()};
const ago=ts=>{const d=Math.round((sod(Date.now())-sod(ts))/DAY);return d<=0?'today':d===1?'yesterday':d+' days ago'};
const fmtDate=ts=>new Date(ts).toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric'});
const fmtShort=ts=>new Date(ts).toLocaleDateString(undefined,{month:'short',day:'numeric'});
const fmtTime=ts=>new Date(ts).toLocaleTimeString(undefined,{hour:'numeric',minute:'2-digit'});
const fmtDur=sec=>{sec=Math.max(0,Math.round(sec));return Math.floor(sec/60)+':'+String(sec%60).padStart(2,'0')};
const plural=(n,w)=>`${n} ${w}${n===1?'':'s'}`;
function rng(seed){let a=seed>>>0;return()=>{a=(a+0x6D2B79F5)>>>0;let t=a;t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return((t^t>>>14)>>>0)/4294967296}}

/* ================= figure animation ================= */
const GY=90, FL={t:28,n:8,ua:13,fa:12,th:19,sh:19,ft:5};
const dv=a=>{const r=a*Math.PI/180;return [Math.sin(r),Math.cos(r)]};
const mv=(P,a,len,mx=1)=>{const d=dv(a);return [P[0]+d[0]*len*mx,P[1]+d[1]*len]};
const lerp=(a,b,u)=>a+(b-a)*u, sm=u=>u*u*(3-2*u);
function nf(f,v){const o=Object.assign({t:180,lift:0},f);o.a1=f.a1||f.a||[0,0];o.a2=f.a2||f.a||[0,0];o.l1=f.l1||f.l||[0,0];o.l2=f.l2||f.l||[0,0];o.f1=f.f1??f.f??90;o.f2=f.f2??f.f??90;o.n=f.n??(v==='front'?180:o.t);delete o.a;delete o.l;delete o.f;return o}
function lerpPose(p,q,u){const o={};for(const k in p)o[k]=Array.isArray(p[k])?p[k].map((v,i)=>lerp(v,q[k][i],u)):lerp(p[k],q[k],u);return o}
function poseAt(A,ph){const F=A.F,N=F.length;if(N===1)return F[0];
  const seq=A.mode==='loop'?F.map((_,i)=>i):[...F.map((_,i)=>i),...F.slice(1,-1).map((_,i)=>N-2-i)];
  const x=(((ph%1)+1)%1)*seq.length,i=Math.floor(x)%seq.length,u=x-Math.floor(x);
  return lerpPose(F[seq[i]],F[seq[(i+1)%seq.length]],sm(Math.min(1,Math.max(0,(u-0.12)/0.76))))}
function solveFig(p,v){
  const H=[0,0],S=mv(H,p.t,FL.t),J={v,H,S,hd:mv(S,p.n,FL.n)};
  if(v==='front'){
    const d=dv(p.t),r=[-d[1],d[0]],off=(P,k)=>[P[0]+r[0]*k,P[1]+r[1]*k];
    J.RS=off(S,8);J.LS=off(S,-8);J.RH=off(H,5);J.LH=off(H,-5);
    J.E1=mv(J.RS,p.a1[0],FL.ua);J.W1=mv(J.E1,p.a1[1],FL.fa);J.E2=mv(J.LS,p.a2[0],FL.ua,-1);J.W2=mv(J.E2,p.a2[1],FL.fa,-1);
    J.K1=mv(J.RH,p.l1[0],FL.th);J.A1=mv(J.K1,p.l1[1],FL.sh);J.T1=[J.A1[0]+4,J.A1[1]];
    J.K2=mv(J.LH,p.l2[0],FL.th,-1);J.A2=mv(J.K2,p.l2[1],FL.sh,-1);J.T2=[J.A2[0]-4,J.A2[1]];
  }else{
    J.E1=mv(S,p.a1[0],FL.ua);J.W1=mv(J.E1,p.a1[1],FL.fa);J.E2=mv(S,p.a2[0],FL.ua);J.W2=mv(J.E2,p.a2[1],FL.fa);
    J.K1=mv(H,p.l1[0],FL.th);J.A1=mv(J.K1,p.l1[1],FL.sh);J.T1=mv(J.A1,p.l1[1]+p.f1,FL.ft);
    J.K2=mv(H,p.l2[0],FL.th);J.A2=mv(J.K2,p.l2[1],FL.sh);J.T2=mv(J.A2,p.l2[1]+p.f2,FL.ft);
  }
  return J;
}
const GP=['E1','W1','E2','W2','K1','A1','T1','K2','A2','T2'];
const ALLP=['H','S','hd','E1','W1','E2','W2','K1','A1','T1','K2','A2','T2','RS','LS','RH','LH'];
function lowY(J){let m=Math.max(J.H[1]+3,J.S[1]+3);GP.forEach(k=>{if(J[k][1]>m)m=J[k][1]});return m}
function anchorPt(A,J){const a=A.anchor;if(a==='hip')return J.H;if(a==='hand'||a==='handg')return J.W1;if(a==='foot2')return J.A2;if(J.v==='front')return [(J.A1[0]+J.A2[0])/2,0];return J.A1}
function placeRaw(A,ph,cx){const p=poseAt(A,ph),J=solveFig(p,A.v),ap=anchorPt(A,J);
  return {J,dx:cx-ap[0],dy:A.anchor==='hand'?(A.handY||14)-J.W1[1]:GY-lowY(J)-p.lift}}
function shiftJ(J,dx,dy,s,cy){const o={v:J.v};ALLP.forEach(k=>{if(J[k])o[k]=[60+(J[k][0]+dx-60)*s,cy+(J[k][1]+dy-cy)*s]});return o}
function prepAnim(A){
  if(A.F)return;
  A.F=A.frames.map(f=>nf(f,A.v));
  let x0=1e9,x1=-1e9,y0=1e9,y1=-1e9;
  for(let i=0;i<20;i++){const {J,dx,dy}=placeRaw(A,i/20,0);ALLP.forEach(k=>{if(!J[k])return;const x=J[k][0]+dx,y=J[k][1]+dy;x0=Math.min(x0,x);x1=Math.max(x1,x);y0=Math.min(y0,y-(k==='hd'?6:0));y1=Math.max(y1,y)})}
  A.cx=60-(x0+x1)/2;A.cy=A.anchor==='hand'?(A.handY||14):GY;
  const h=A.anchor==='hand'?(y1-y0+10):(GY-y0+6);
  A.s=Math.min(1,104/(x1-x0+12),86/h);
  A.fix=place(A,0);
  const xs=ALLP.filter(k=>A.fix[k]).map(k=>A.fix[k][0]);A.fix.minX=Math.min(...xs);A.fix.maxX=Math.max(...xs);
}
function place(A,ph){const {J,dx,dy}=placeRaw(A,ph,A.cx);return shiftJ(J,dx,dy,A.s,A.cy)}
const f1=n=>n.toFixed(1);
const ln=(a,b,c)=>`<line class="${c}" x1="${f1(a[0])}" y1="${f1(a[1])}" x2="${f1(b[0])}" y2="${f1(b[1])}"/>`;
const pl=(pts,c)=>`<polyline class="${c}" points="${pts.map(p=>f1(p[0])+','+f1(p[1])).join(' ')}"/>`;
const ci=(c,r,cl)=>`<circle class="${cl}" cx="${f1(c[0])}" cy="${f1(c[1])}" r="${f1(r)}"/>`;
function benchShape(x1,x2,y){return `<rect class="pbf" x="${f1(x1)}" y="${f1(y)}" width="${f1(x2-x1)}" height="3.4" rx="1.2"/>`+ln([x1+3,y],[x1+3,GY+2],'pb')+ln([x2-3,y],[x2-3,GY+2],'pb')}
function figInner(key,ph){
  const A=ANIM[key]||ANIM.mountain;prepAnim(A);
  const J=place(A,ph),F=A.fix,s=A.s,P=k=>(A.props||[]).includes(k);
  let back='',front='';
  if(P('bar')){const y=F.W1[1];back+=ln([14,y],[106,y],'pb')+ln([16,y],[16,GY+2],'pb')+ln([104,y],[104,GY+2],'pb')}
  if(P('bench')){const x1=Math.min(J.S[0],J.H[0])-6*s,x2=Math.max(J.S[0],J.H[0])+7*s;back+=benchShape(x1,x2,Math.max(J.S[1],J.H[1])+3.6*s)}
  if(P('benchHand'))back+=benchShape(J.W1[0]-17*s,J.W1[0]+4*s,J.W1[1]+2.6*s);
  if(P('seat'))back+=benchShape(J.H[0]-13*s,J.H[0]+8*s,J.H[1]+3.6*s);
  if(P('wallB')){const x=F.minX-4;back+=ln([x,8],[x,GY+2],'pb')}
  if(P('wallF')){const x=F.maxX+4;back+=ln([x,8],[x,GY+2],'pb')}
  const pul={cableH:[F.maxX+12,10],cableM:[F.maxX+12,F.S[1]+4],cableL:[F.maxX+12,GY-6],cableU:[F.W1[0],5]};
  for(const k in pul)if(P(k))back+=ln(pul[k],J.W1,'pl')+ci(pul[k],2.6,'p');
  if(P('cableX'))back+=ln([8,12],J.W2,'pl')+ln([112,12],J.W1,'pl')+ci([8,12],2.6,'p')+ci([112,12],2.6,'p');
  if(P('bandB'))back+=ln([F.minX-8,F.S[1]+6],J.W1,'bd');
  if(P('bandF'))front+=ln(J.W1,J.W2,'bd');
  if(P('bandK'))front+=ln(J.K1,J.K2,'bd');
  if(P('bandL')){front+=ln(J.A1,J.W1,'bd');if(J.v==='front')front+=ln(J.A2,J.W2,'bd')}
  if(P('bandFoot'))front+=ln(J.T1,J.W1,'bd');
  if(P('tread')){back+=`<rect class="pbf" x="${f1(F.minX-10)}" y="${GY}" width="${f1(F.maxX-F.minX+26)}" height="3.4" rx="1.5"/>`+ln([F.maxX+14,GY],[F.maxX+10,GY-44],'pb')+ln([F.maxX+10,GY-44],[F.maxX+1,GY-42],'pb')}
  if(P('bike')){const c=[F.H[0]+13,GY-10];back+=ci(c,10,'pl')+ln(F.H,c,'pb')+ln(c,F.W1,'pb')+ln([F.H[0]-5,F.H[1]+3],[F.H[0]+6,F.H[1]+3],'pb')}
  if(P('db')){if(J.v!=='front')back+=ci(J.W2,4*s,'p far');else front+=ci(J.W2,4*s,'p');front+=ci(J.W1,4*s,'p')}
  if(P('db1'))front+=ci(J.W1,4.4*s,'p');
  if(P('kb'))front+=ci([J.W1[0],J.W1[1]+5*s],5*s,'p');
  if(P('bb')){if(J.v==='front'){const y=(J.W1[1]+J.W2[1])/2;front+=ln([J.W2[0]-14,y],[J.W1[0]+14,y],'pb')+ci([J.W2[0]-12,y],5,'p')+ci([J.W1[0]+12,y],5,'p')}else front+=ci(J.W1,8*s,'p')}
  if(P('bbHip'))front+=ci([J.H[0],J.H[1]-8*s],8*s,'p');
  const hr=ci(J.hd,5*s,'hd');
  const body=J.v==='front'

function syncLibrary(d){
  const have=new Map(d.exercises.map(e=>[e.id,e]));
  LIB.forEach(l=>{const e=have.get(l.id);if(!e)d.exercises.push(clone(l));else['name','part','eq','type','pattern','anim','cue','sides','pos','area','end','easy','perHand','allowLoad','maxSets'].forEach(k=>{if(l[k]!==undefined)e[k]=clone(l[k]);else delete e[k]})});
  d.exercises.forEach(e=>{if(!LIB_IDS.has(e.id)){e.custom=true;e.eq=e.eq||[];e.part=e.part||'core';e.anim=e.anim||'mountain';e.pattern=e.pattern||'custom'}});
  d.targets=d.targets||{};d.decisions=d.decisions||[];d.equipment=d.equipment||['db','bench'];
  return d;
}
function migrateV1(o){
  const d=freshDB(false), map={};
  const real=o.sessions.filter(s=>!s.example&&s.status==='done');
  if(!real.length)return null;
  o.exercises.forEach(x=>{const m=LIB.find(l=>l.name.toLowerCase()===String(x.name).toLowerCase());if(m)map[x.id]=m.id;else{const id='c_'+uid();map[x.id]=id;d.exercises.push(Object.assign({},x,{id,custom:true,part:'core',eq:[],anim:'mountain',pattern:'custom'}))}});
  d.sessions=real.map(s=>Object.assign({},s,{kind:'strength',entries:s.entries.map(e=>Object.assign({},e,{exId:map[e.exId]||e.exId,block:'main'}))}));
  d.unit=o.unit||'lb';return d;
}

  try{const s=localStorage.getItem(KEY1);if(s){const m=migrateV1(JSON.parse(s));if(m)return syncLibrary(m)}}catch(e){}
  return seed();
}

function setReps(ex,s){
  if(model(ex)==='uni'){const l=num(s.lReps),r=num(s.rReps);if(l==null&&r==null)return null;if(l==null)return r;if(r==null)return l;return Math.min(l,r)}
  return num(s.reps);
}
function setVol(ex,s){
  const m=model(ex);
  if(m==='uni')return (num(s.load)||0)*(num(s.lReps)||0)+(num(s.rLoad)??num(s.load)??0)*(num(s.rReps)||0);
  if(m==='load'||m==='rehab')return (num(s.load)||0)*(num(s.reps)||0);
  if(m==='bw')return (num(s.addLoad)||0)*(num(s.reps)||0);
  return 0;
}
const e1rm=(l,r)=>(l>0&&r>=1&&r<=12)?(r===1?l:l*(1+r/30)):null;
function entryStats(ex,e){
  const d=e.sets.filter(s=>s.done), m=model(ex);
  const st={n:d.length,done:d,pain:max(d.map(s=>num(s.pain)||0)),rpe:null,avgRpe:null};
  const rp=d.map(s=>num(s.rpe)).filter(v=>v!=null);
  if(rp.length){st.rpe=Math.max(...rp);st.avgRpe=sum(rp)/rp.length}
  if(m==='load'||m==='rehab'||m==='uni'){
    st.top=max(d.map(s=>num(s.load)||0));st.reps=d.map(s=>setReps(ex,s)||0);st.totalReps=sum(st.reps);
    st.vol=sum(d.map(s=>setVol(ex,s)));st.bestReps=max(st.reps);
    st.e1rm=m==='rehab'?null:(max(d.map(s=>e1rm(num(s.load)||0,setReps(ex,s)||0)||0))||null);
    if(m==='uni'){st.l=d.map(s=>num(s.lReps)||0);st.r=d.map(s=>num(s.rReps)||0)}
  }else if(m==='bw'){
    st.reps=d.map(s=>num(s.reps)||0);st.totalReps=sum(st.reps);st.bestReps=max(st.reps);
    st.add=max(d.map(s=>num(s.addLoad)||0));st.assist=d.length?Math.min(...d.map(s=>num(s.assist)||0)):0;
    st.vol=sum(d.map(s=>setVol(ex,s)));
  }else if(m==='time'){
    st.durs=d.map(s=>num(s.duration)||0);st.best=max(st.durs);st.total=sum(st.durs);st.level=max(d.map(s=>num(s.level)||0));
  }else{
    st.dur=sum(d.map(s=>num(s.duration)||0));st.dist=r2(sum(d.map(s=>num(s.distance)||0)));
    const sp=d.map(s=>num(s.speed)).filter(v=>v);
    st.speed=st.dur&&st.dist?r1(st.dist/(st.dur/60)):(sp.length?Math.max(...sp):0);
  }
  return st;
}
function perfScore(ex,st){
  const m=model(ex);
  if(m==='load'||m==='uni')return st.e1rm||st.vol;
  if(m==='rehab')return st.vol||st.totalReps;
  if(m==='bw')return st.totalReps*(1+((st.add||0)-(st.assist||0))/200);
  if(m==='time')return st.total*(1+0.2*(st.level||0));
  return st.dist||st.dur;
}
const tonnage=(ex,st)=>(loadish(ex)||model(ex)==='bw')?(st.vol||0):0;

const KIND={new:'New',increase:'Add load',build:'Add reps',hold:'Repeat',reduce:'Ease off',level:'Harder version',addset:'Add a set',longer:'Go longer',assist:'Less assistance'};
const KIND_CHIP={increase:'good',level:'good',addset:'good',longer:'good',assist:'good',build:'accent',reduce:'bad',hold:'',new:''};
function rangeOf(ex,rg){rg=rg||{};return {sets:rg.sets??ex.sets??3,lo:rg.repMin??ex.repMin,hi:rg.repMax??ex.repMax}}
function baseTarget(ex,rg){
  const m=model(ex),R=rangeOf(ex,rg);
  if(m==='time')return {sets:R.sets,duration:rg?.duration??ex.duration??30,level:0};
  if(m==='cardio')return {sets:1,duration:rg?.duration??ex.duration??20};
  if(m==='bw')return {sets:R.sets,repMin:R.lo,repMax:R.hi,perSet:Array(R.sets).fill(R.lo),addLoad:0,assist:0};
  return {sets:R.sets,load:ex.start||0,repMin:R.lo,repMax:R.hi,perSet:Array(R.sets).fill(R.lo)};
}
function recNew(ex,rg){
  const t=baseTarget(ex,rg), m=model(ex), reasons=['First time. Today sets your baseline.'];
  if(m==='load'||m==='uni')reasons.push(`Start at ${t.load} ${loadCap(ex)} or lighter: stop with 3–4 reps left in the tank.`);
  if(m==='rehab')reasons.push('Pick a load that causes no pain during or after.');
  if(m==='bw')reasons.push(`Aim for ${t.repMin} clean reps and stop 2–3 reps before failure.`);
  if(m==='time')reasons.push(`Hold ${t.duration} s with good form.`);
  if(m==='cardio')reasons.push(`Easy pace you can talk at, ${t.duration} min.`);
  return {kind:'new',target:t,reasons,basedOn:null,plateau:null,pain:false};
}
function trendOf(ex,hist){
  if(hist.length<3)return 'new';
  const sc=hist.slice(-4).map(h=>perfScore(ex,entryStats(ex,h.e)));
  const bestEarlier=Math.max(...sc.slice(0,-2));
  if(sc.slice(-2).every(v=>v<bestEarlier*0.97))return 'down';
  if(sc[sc.length-1]>sc[0]*1.01)return 'up';
  return 'flat';
}
function weeklySetsFor(part,until){
  const from=until-7*DAY;
  return sum(db.sessions.filter(s=>s.status==='done'&&s.date>from&&s.date<=until).flatMap(s=>s.entries.map(e=>{const x=exById(e.exId);return x&&x.part===part&&e.block!=='warm'&&e.block!=='cool'?e.sets.filter(t=>t.done).length:0})));
}
function detectPlateau(ex,hist){
  const m=model(ex);
  if(hist.length<4||m==='cardio'||isFlex(ex)||isWarm(ex))return null;
  const w=hist.slice(-4), ss=w.map(h=>entryStats(ex,h.e)), sc=ss.map(s=>perfScore(ex,s));
  if((m==='load'||m==='uni'||m==='rehab')&&new Set(ss.map(s=>s.top)).size>1)return null;
  if(m==='bw'&&new Set(ss.map(s=>(s.add||0)-(s.assist||0))).size>1)return null;
  if(m==='time'&&new Set(ss.map(s=>s.level)).size>1)return null;
  if(Math.max(...sc.slice(1))>sc[0]*1.01)return null;
  const days=Math.max(1,Math.round((w[3].s.date-w[0].s.date)/DAY));

/* ================= prescriptions and decisions ================= */
function prescribe(ex,s,rg){

}
function getRec(ex,ctx,sessId,entryId){

  if(ctx==='card'&&s)return recommend(ex,exHistory(ex.id,s.date),{readiness:s.readiness,now:s.date,range:rg});
  if(ctx==='summary'&&s){const e2=s.entries.find(x=>x.exId===ex.id);return recommend(ex,exHistory(ex.id,s.date,true),{now:Date.now(),range:e2?.range})}

}
function repeatTarget(ex,rec){

  if(!e)return clone(rec.target);
  const st=entryStats(ex,e), m=model(ex), bt=Object.assign(baseTarget(ex,e.range),e.target||{}), R=rangeOf(ex,e.range);
  if(m==='time')return {sets:bt.sets,duration:st.best||bt.duration,level:st.level||0};
  if(m==='cardio')return {sets:1,duration:st.dur||bt.duration};
  const sets=bt.sets||3, per=Array.from({length:sets},(_,i)=>st.reps[i]??R.lo);
  if(m==='bw')return {sets,repMin:R.lo,repMax:R.hi,perSet:per,addLoad:st.add||0,assist:st.assist||0};

function newSet(ex,t,prev,side){
  return {id:uid(),done:false,side:side||null,load:prev?.load??t.load??null,rLoad:prev?.rLoad??null,addLoad:prev?.addLoad??(t.addLoad||null),
    assist:prev?.assist??(t.assist||null),level:prev?.level??(t.level||null),speed:prev?.speed??null,incline:prev?.incline??null};

/* ================= records ================= */
function bests(ex,hist){
  const b={load:0,repsAt:{},vol:0,e1rm:0,reps:0,total:0,hold:0,level:0,dist:0,dur:0,speed:0,add:0}, m=model(ex);

    if(loadish(ex)){for(const s of st.done){const Lo=num(s.load)||0,r=setReps(ex,s)||0;if(r>=1){if(Lo>b.load)b.load=Lo;b.repsAt[String(Lo)]=Math.max(b.repsAt[String(Lo)]||0,r)}}b.vol=Math.max(b.vol,st.vol);if(st.e1rm)b.e1rm=Math.max(b.e1rm,st.e1rm);b.reps=Math.max(b.reps,st.bestReps)}
    else if(m==='bw'){b.reps=Math.max(b.reps,st.bestReps);b.total=Math.max(b.total,st.totalReps);b.add=Math.max(b.add,st.add)}
    else if(m==='time'){b.hold=Math.max(b.hold,st.best);b.level=Math.max(b.level,st.level);b.total=Math.max(b.total,st.total)}
    else{b.dist=Math.max(b.dist,st.dist);b.dur=Math.max(b.dur,st.dur);b.speed=Math.max(b.speed,st.speed||0)}}
  return b;
}

  const b=bests(ex,prior), st=entryStats(ex,e), m=model(ex), u=loadCap(ex), out=[];
  if(!st.n)return out;
  if(loadish(ex)){
    const byL={};st.done.forEach(s=>{const Lo=num(s.load)||0,r=setReps(ex,s)||0;if(r>=1)byL[String(Lo)]=Math.max(byL[String(Lo)]||0,r)});
    if(st.top>b.load)out.push({label:'Heaviest',value:`${st.top} ${u} × ${byL[String(st.top)]}`});
    for(const [Lo,r] of Object.entries(byL))if(b.repsAt[Lo]!=null&&r>b.repsAt[Lo])out.push({label:`Most reps at ${Lo} ${u}`,value:`${r}`});
    if(b.vol>0&&st.vol>b.vol)out.push({label:'Volume',value:`${fmtK(st.vol)} ${db.unit}`});
    if(b.e1rm>0&&st.e1rm&&st.e1rm>b.e1rm+0.01)out.push({label:'Est. max',value:`${Math.round(st.e1rm)} ${u}`,est:true});
  }else if(m==='bw'){
    if(st.bestReps>b.reps)out.push({label:'Best set',value:`${st.bestReps} reps`});
    if(st.totalReps>b.total)out.push({label:'Total reps',value:`${st.totalReps}`});
    if(st.add>b.add)out.push({label:'Added load',value:`+${st.add} ${db.unit}`});
  }else if(m==='time'){
    if(st.best>b.hold)out.push({label:isFlex(ex)?'Longest stretch':'Longest hold',value:`${st.best} s`});
    if(st.level>b.level)out.push({label:'Level',value:`${st.level}`});
  }else{
    if(st.dist>b.dist)out.push({label:'Distance',value:`${st.dist} km`});
    if(st.dur>b.dur)out.push({label:'Duration',value:`${st.dur} min`});
    if(st.speed>b.speed+0.001&&b.speed>0)out.push({label:'Speed',value:`${st.speed} km/h`});

  return out;

function buildFlex(o){
  const f=FLEXFOCUS.find(x=>x.id===o.focus)||FLEXFOCUS[0], rand=rng(o.seed||1);

  if(!f.list)pool=pool.map(ex=>[ex,rand()]).sort((a,b)=>a[1]-b[1]).map(x=>x[0]);

  const end=rest?exById('savasana'):null, endSec=end?Math.min(120,Math.max(45,Math.round(total*0.08))):0;

function card(s,e,mode){

function analyze(ex,st,pst,e,status){
  const m=model(ex),u=loadCap(ex),out=[],t=e.target||{};
  if(!pst)out.push('First time. Baseline set.');
  else if(loadish(ex)){if(st.top>pst.top)out.push(`Up to ${st.top} ${u} from ${pst.top}.`);else if(st.top<pst.top)out.push(`${st.top} ${u}, down from ${pst.top}.`);else{const d=st.totalReps-pst.totalReps;out.push(d>0?`+${d} rep${d===1?'':'s'} vs last time.`:d<0?`${d} reps vs last time.`:'Same reps as last time.')}}
  else if(m==='bw'){const d=st.totalReps-pst.totalReps;out.push(d>0?`+${d} rep${d===1?'':'s'} vs last time.`:d<0?`${d} reps vs last time.`:'Same reps as last time.')}
  else if(m==='time'){const d=st.total-pst.total;out.push(d>0?`+${d} s vs last time.`:d<0?`${d} s vs last time.`:'Same time as last time.')}
  else{const d=r1(st.dur-pst.dur);out.push(d>0?`+${d} min vs last time.`:d<0?`${d} min vs last time.`:'Same duration.')}
  if((loadish(ex)||m==='bw')&&t.repMax&&st.n>=(t.sets||1)&&st.reps.slice(0,t.sets||1).every(r=>r>=t.repMax))out.push(`Top of range (${t.repMax}) on every set.`);

}

  if(loadish(ex)){r.push(['Heaviest',`${b.load} ${u}`,0]);if(b.e1rm)r.push(['Estimated max',`${Math.round(b.e1rm)} ${u}`,1]);r.push(['Best volume',`${fmtK(b.vol)} ${db.unit}`,0],['Most reps',`${b.reps}`,0]);Object.keys(b.repsAt).map(Number).sort((a,c)=>c-a).slice(0,4).forEach(Lo=>r.push([`Reps at ${Lo} ${u}`,`${b.repsAt[String(Lo)]}`,0]))}
  else if(m==='bw'){r.push(['Best set',`${b.reps} reps`,0],['Total reps',`${b.total}`,0]);if(b.add)r.push(['Added load',`+${b.add} ${db.unit}`,0])}
  else if(m==='time'){r.push(['Longest',`${b.hold} s`,0],['Total',`${b.total} s`,0]);if(b.level)r.push(['Level',`${b.level}`,0])}

  return r;
}
