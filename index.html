<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TIP</title>
<meta name="description" content="TIP workout app: generated workouts, programs, guided stretching and progressive overload tracking.">
<meta name="theme-color" content="#090A0F">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="TIP">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;600;700&family=Sora:wght@600;700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap">
<style>
/* Layout: one-column athletic lab (max 760px) on an obsidian ground; glass pods, pill controls, bottom tab bar; animated figures lead every item. Single dark look by design (Kinetix). */
:root{
  --bg:#090A0F; --surface:#11141C; --surface-2:#191D27; --panel:rgba(17,20,29,.8); --line:rgba(255,255,255,.08); --line-2:rgba(255,255,255,.14);
  --ink:#F8FAFC; --muted:#94A3B8; --fig-far:#4B5568;
  --accent:#00F0FF; --accent-ink:#00262A; --accent-soft:rgba(0,240,255,.10); --accent-line:rgba(0,240,255,.35);
  --volt:#CCFF00; --volt-ink:#141A00; --volt-soft:rgba(204,255,0,.12);
  --good:#CCFF00; --on-good:#141A00; --good-soft:rgba(204,255,0,.12);
  --warn:#FFB547; --warn-soft:rgba(255,181,71,.13);
  --bad:#FF6B6B; --bad-soft:rgba(255,107,107,.13);
  --pr:#CCFF00; --pr-soft:rgba(204,255,0,.10);
  --xp:#B57BFF; --xp-soft:rgba(181,123,255,.14);
  --glow:0 0 24px rgba(0,240,255,.22);
  --scrim:rgba(3,4,8,.74);
  --shadow:0 12px 40px rgba(0,0,0,.55);
  --display:"Sora","Segoe UI",system-ui,sans-serif;
  --body:"Space Grotesk",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{background:var(--bg)}
body{background:radial-gradient(900px 480px at 92% -8%,rgba(0,240,255,.09),transparent 60%),radial-gradient(700px 520px at -15% 30%,rgba(138,43,226,.10),transparent 60%),var(--bg);background-attachment:fixed;color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0 calc(100px + env(safe-area-inset-bottom,0px))}
body.playing #tabs,body.playing #timer{display:none}
#app{max-width:760px;margin:0 auto;padding-block:18px 24px;display:flex;flex-direction:column;gap:16px}
h1,h2,h3{font-family:var(--display);margin:0;line-height:1.08;text-wrap:balance}
h1{font-size:clamp(28px,7.4vw,38px);font-weight:700;text-transform:uppercase;letter-spacing:-.025em}
h2{font-size:17px;font-weight:700;text-transform:uppercase;letter-spacing:-.005em}
h3{font-size:17px;font-weight:600;letter-spacing:-.01em}
p{margin:0}
.eyebrow{font-family:var(--mono);font-size:10.5px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);font-weight:600}
.mono{font-family:var(--mono);font-size:11px;color:var(--muted);letter-spacing:.02em}
.muted{color:var(--muted)}
.small{font-size:13px}
.num{font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn{border:1px solid var(--line-2);background:rgba(255,255,255,.04);border-radius:999px;padding:9px 16px;font-weight:600;min-height:44px;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn.primary{background:var(--volt);border-color:var(--volt);color:var(--volt-ink);font-family:var(--display);box-shadow:0 0 22px rgba(204,255,0,.18)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--accent);padding-inline:8px}
.btn.danger{color:var(--bad)}
.btn.wide{width:100%;min-height:56px;font-size:17px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.icon-btn{width:44px;height:44px;border-radius:50%;border:1px solid var(--line-2);background:rgba(255,255,255,.04);display:inline-grid;place-items:center;padding:0;flex:none}
.icon-btn svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.link{background:none;border:0;padding:4px 2px;color:var(--accent);font-weight:600;font-size:13px;min-height:32px}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.page-head .right{display:flex;gap:8px;align-items:center}
.back{align-self:flex-start;margin-bottom:-8px}
.panel{background:var(--panel);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);border:1px solid var(--line);border-radius:22px;padding:16px;display:flex;flex-direction:column;gap:14px;min-width:0}
.row-between{display:flex;justify-content:space-between;align-items:center;gap:8px 12px;flex-wrap:wrap}
.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chip{display:inline-flex;align-items:center;gap:4px;font-family:var(--mono);font-size:10.5px;letter-spacing:.04em;text-transform:uppercase;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--surface-2);color:var(--muted);white-space:nowrap;line-height:1.6}
.chip.good{background:var(--good-soft);color:var(--good)}
.chip.accent{background:var(--accent-soft);color:var(--accent)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.bad{background:var(--bad-soft);color:var(--bad)}
.chip.pr{background:var(--pr-soft);color:var(--pr)}
.note{border-radius:10px;padding:12px 14px;background:var(--warn-soft);font-size:14px;display:flex;flex-direction:column;gap:8px}
.note.info{background:var(--accent-soft)}
.note.bad{background:var(--bad-soft)}
/* figures */
svg.fig{display:block;width:100%;height:auto;overflow:visible}
.fig .gnd{stroke:var(--line);stroke-width:1.5}
.fig .b{stroke:var(--ink);stroke-width:5;stroke-linecap:round;stroke-linejoin:round;fill:none}
.fig .b.t{stroke-width:6.5}
.fig .b.far{stroke:var(--fig-far)}
.fig .hd{fill:var(--ink)}
.fig .p{fill:var(--accent)}
.fig .p.far{fill:var(--fig-far)}
.fig .pl{stroke:var(--accent);stroke-width:1.8;fill:none}
.fig .pb{stroke:var(--muted);stroke-width:2.6;fill:none;stroke-linecap:round}
.fig .pbf{fill:var(--muted)}
.fig .hl{stroke:var(--volt);stroke-width:11;stroke-linecap:round;opacity:.36;fill:none}
.fig .bd{stroke:var(--accent);stroke-width:1.8;stroke-dasharray:3 2.5;fill:none}
.figbox{background:radial-gradient(circle at 50% 62%,rgba(0,240,255,.08),transparent 70%),var(--surface-2);border:1px solid var(--line);border-radius:14px;padding:4px;flex:none}
.eqi{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
/* pickers */
.tile-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:8px}
.tile{border:1px solid var(--line);background:rgba(255,255,255,.03);border-radius:16px;padding:6px 6px 8px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:13px;font-weight:600;min-height:44px}
.tile svg.fig{width:100%;max-width:84px}
.tile[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent);box-shadow:var(--glow)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.tg{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line-2);background:rgba(255,255,255,.03);border-radius:999px;padding:6px 12px;font-size:14px;font-weight:600;min-height:40px}
.tg[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.tg.fixed{opacity:.7;cursor:default}
.seg{display:flex;gap:6px}
.seg button{flex:1;min-height:44px;border:1px solid var(--line-2);background:rgba(255,255,255,.03);border-radius:999px;font-family:var(--display);font-size:16px;font-weight:600}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);box-shadow:var(--glow)}
.seg button small{font-family:var(--body);font-size:11px;font-weight:500;opacity:.75;margin-left:2px}
.seg-wrap{display:flex;flex-direction:column;gap:6px}
.seg-legend{display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}
.field-label{display:flex;align-items:center;gap:8px}
/* item rows */
.items{display:flex;flex-direction:column;gap:8px}
.block-label{display:flex;align-items:center;gap:8px;margin-top:4px}
.item{display:grid;grid-template-columns:72px minmax(0,1fr) auto;gap:12px;align-items:center;border:1px solid var(--line);border-radius:18px;padding:6px 8px 6px 6px;background:rgba(255,255,255,.025)}
.item .figbox{width:72px}
.item-name{background:none;border:0;padding:0;text-align:left;font-weight:600;font-size:15px;line-height:1.25}
.item-sub{display:block;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.item-acts{display:flex;gap:6px}
.item-acts .icon-btn{width:40px;height:40px}
.sum-line{display:flex;gap:14px;flex-wrap:wrap;font-size:14px;color:var(--muted)}
.sum-line b{color:var(--ink);font-family:var(--display);font-size:22px;margin-right:3px}
.sticky-cta{position:sticky;bottom:calc(82px + env(safe-area-inset-bottom,0px));z-index:5}
/* exercise card */
.ex-head{display:grid;grid-template-columns:76px minmax(0,1fr) auto;gap:12px;align-items:center}
.ex-head .figbox{width:76px}
.ex-title{min-width:0}
.meta{display:block;margin-top:2px;font-size:13px;color:var(--muted)}
.prev{display:flex;flex-direction:column;gap:2px;font-size:15px}
.prline{font-size:13px;color:var(--pr);font-weight:600}
.rx{display:flex;flex-wrap:wrap;align-items:center;gap:4px 10px;padding:10px 12px;background:var(--surface-2);border-radius:14px}
.rx strong{font-family:var(--display);font-size:16px;font-weight:600;letter-spacing:.01em}
.sets{display:flex;flex-direction:column}
.set{display:grid;grid-template-columns:22px minmax(0,1fr) 58px 50px;gap:6px;align-items:center;padding:10px 0 2px;border-top:1px solid var(--line)}
.set-n{font-family:var(--display);font-size:20px;font-weight:700;color:var(--muted);text-align:center}
.set.is-done .set-n{color:var(--good)}
.fields{display:flex;flex-wrap:wrap;gap:6px;min-width:0}
.stepper{display:grid;grid-template-columns:30px 50px 30px;height:54px;border:1px solid var(--line-2);border-radius:14px;background:var(--surface-2);overflow:hidden}
.stepper button{border:0;background:transparent;font-size:20px;font-weight:600;color:var(--muted);padding:0}
.stepper button:active{background:var(--line)}
.stepper .mid{display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--surface);border-inline:1px solid var(--line);cursor:text}
.stepper input{width:100%;border:0;background:transparent;text-align:center;font-family:var(--display);font-size:19px;font-weight:600;padding:0;color:var(--ink);font-variant-numeric:tabular-nums;line-height:1.1}
.stepper input::placeholder{color:var(--muted);opacity:.7}
.stepper input:focus{outline:none}
.stepper .mid:focus-within{box-shadow:inset 0 0 0 2px var(--accent)}
.stepper .cap{font-size:9.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);line-height:1;white-space:nowrap}
.set.is-done .stepper .mid{background:var(--good-soft)}
.rpe{height:54px;width:100%;border:1px solid var(--line-2);border-radius:14px;background:var(--surface);color:var(--ink);font:600 15px var(--body);text-align:center;text-align-last:center;padding:0 2px;-webkit-appearance:none;appearance:none}
.play{height:54px;width:100%;border:1px solid var(--accent);border-radius:14px;background:var(--accent-soft);color:var(--accent);font-size:18px;font-weight:700}
.tick{height:52px;width:52px;border-radius:50%;border:1.5px solid var(--line);background:var(--surface);font-size:24px;font-weight:700;color:var(--muted)}
.set.is-done .tick{background:var(--good);border-color:var(--good);color:var(--on-good);box-shadow:0 0 18px rgba(204,255,0,.35)}
.set-foot{grid-column:1/-1;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;padding-left:28px;min-height:32px}
.hint{font-size:12.5px;color:var(--muted)}
.hint .pain{color:var(--bad);font-weight:600}
.foot-acts{display:flex;gap:12px}
.set-more{grid-column:1/-1;display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;padding:10px;margin:0 0 8px;background:var(--surface-2);border-radius:8px}
.set-more .wide{grid-column:1/-1}
.card-actions{display:flex;gap:8px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:12px}
.guided{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:12px;background:var(--accent-soft);border-radius:12px;padding:10px 12px}
.guided .figs{display:flex;gap:4px;overflow:hidden}
.guided .figs .figbox{width:48px;background:var(--surface)}
/* forms */
.fld{display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:var(--muted);font-weight:600;min-width:0}
.fld input,.fld select,textarea{font:inherit;font-weight:400;color:var(--ink);background:rgba(14,17,24,.9);border:1px solid var(--line-2);border-radius:12px;padding:9px 10px;min-height:44px;width:100%}
textarea{font-size:13px;font-family:ui-monospace,Menlo,Consolas,monospace;resize:vertical}
.form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.form-grid .wide{grid-column:1/-1}
/* recommendation */
.rec{border:1.5px solid var(--line);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.rec.k-increase,.rec.k-level,.rec.k-addset,.rec.k-longer,.rec.k-assist{border-color:var(--good)}
.rec.k-reduce{border-color:var(--bad)}
.rec-head{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center}
.rec-head strong{font-family:var(--display);font-size:16px;font-weight:600}
details.why summary{cursor:pointer;color:var(--accent);font-weight:600;font-size:13px;min-height:28px;display:inline-flex;align-items:center}
.reasons,.analysis{margin:0;padding-left:18px;font-size:14px;display:flex;flex-direction:column;gap:3px}
.decision{font-size:14px}
.plateau{background:var(--warn-soft);border-radius:10px;padding:12px 14px;font-size:14px;display:flex;flex-direction:column;gap:6px}
.plateau ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px}
/* lists */
.list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.list > li{border-top:1px solid var(--line)}
.list > li:first-child{border-top:0}
.row-btn{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;width:100%;text-align:left;background:none;border:0;padding:8px 2px;min-height:56px}
.row-btn .figbox{width:56px}
.row-btn strong{display:block;font-weight:600}
.row-right{display:flex;align-items:center;gap:10px}
.eq-icons{display:inline-flex;gap:3px;color:var(--muted);vertical-align:middle}
.eq-icons .eqi{width:15px;height:15px}
/* program */
.prog-card{display:grid;grid-template-columns:84px minmax(0,1fr);gap:12px;align-items:center;text-align:left;border:1px solid var(--line);background:rgba(255,255,255,.03);border-radius:20px;padding:10px;width:100%}
.prog-card .figbox{width:84px}
.prog-card strong{font-family:var(--display);font-size:16px;font-weight:700;text-transform:uppercase;letter-spacing:-.01em;display:block;line-height:1.1}
.prog-meta{display:flex;flex-wrap:wrap;gap:4px 6px;margin-top:4px}
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.day{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 2px;border-radius:10px;background:var(--surface-2);font-size:12px;font-weight:600;color:var(--muted);min-height:58px}
.day .dot{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-size:12px}
.day.plan .dot{border-color:var(--accent)}
.day.done .dot{background:var(--good);border-color:var(--good);color:var(--on-good)}
.day.today{outline:2px solid var(--accent);outline-offset:-2px;color:var(--ink)}
button.day{border:0}
button.day[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.bar-track{height:10px;border-radius:5px;background:var(--surface-2);overflow:hidden}
.bar-track i{display:block;height:100%;background:var(--accent);border-radius:5px}
/* charts and stats */
.range{display:flex;gap:4px;flex-wrap:wrap}
.range button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:13px;font-weight:600;min-height:36px}
.range button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.charts{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px}
.chart-card{background:var(--surface-2);border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:6px;min-width:0}
.chart-card h3{font-size:15px;font-weight:600;font-family:var(--body)}
svg.chart{width:100%;height:auto;display:block;overflow:visible}
.chart .gd{stroke:var(--line);stroke-width:1}
.chart .ax{fill:var(--muted);font:500 15px var(--body)}
.chart .ln{stroke:var(--accent);stroke-width:3;fill:none;stroke-linejoin:round;stroke-linecap:round}
.chart .ln.est{stroke-dasharray:7 6}
.chart .ar{fill:var(--accent);opacity:.12}
.chart .dt{fill:var(--surface-2);stroke:var(--accent);stroke-width:2.5}
.chart .end{fill:var(--accent)}
.chart .lbl{fill:var(--ink);font:600 17px var(--body)}
.chart .bar{fill:var(--accent);opacity:.8}
.chart .bar.now{opacity:1}
.chart-empty{padding:28px 8px;text-align:center;color:var(--muted);font-size:14px}
.spark{width:96px;height:28px;display:block}
.spark polyline{fill:none;stroke:var(--accent);stroke-width:2;stroke-linejoin:round}
.spark circle{fill:var(--accent)}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (min-width:640px){.tiles{grid-template-columns:repeat(4,minmax(0,1fr))}}
.stat{background:var(--surface-2);border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.stat b{font-family:var(--display);font-size:26px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.stat span{font-size:12.5px;color:var(--muted)}
.bars{display:flex;flex-direction:column;gap:8px}
.bar-row{display:grid;grid-template-columns:86px minmax(0,1fr) 30px;gap:10px;align-items:center;font-size:14px}
.bar-row .n{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
.meter{height:12px;background:var(--surface-2);border-radius:6px;position:relative;overflow:hidden}
.meter .band{position:absolute;top:0;bottom:0;background:var(--good-soft)}
.meter i{position:absolute;inset:0 auto 0 0;background:var(--accent);border-radius:6px}
.pr-list{display:flex;flex-direction:column;gap:6px}
.pr-item{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:8px 12px;border-radius:8px;background:var(--pr-soft);font-size:14px}
.pr-item b{font-variant-numeric:tabular-nums}
.cmp{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:0}
.cmp div{background:var(--surface-2);border-radius:8px;padding:10px 12px;min-width:0}
.cmp dt{font-size:11.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.cmp dd{margin:2px 0 0;font-variant-numeric:tabular-nums;font-weight:600}
.status-groups{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.status-groups > div{display:flex;flex-direction:column;gap:4px;align-items:flex-start}
.tbl-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px;font-variant-numeric:tabular-nums}
th{text-align:left;font-size:11.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600;padding:6px 8px;border-bottom:1px solid var(--line)}
td{padding:8px;border-bottom:1px solid var(--line);vertical-align:top}
td .link{min-height:0;padding:0}

.today-t{min-width:0;display:flex;flex-direction:column;gap:2px}
.today-t strong{font-family:var(--display);font-size:18px;text-transform:uppercase}
.rec-ring{width:76px;height:76px;position:relative;display:grid;place-items:center;flex:none}
.rec-ring svg{position:absolute;inset:0;transform:rotate(-90deg)}
.rec-ring circle{fill:none;stroke-width:7}
.rec-ring b{font-family:var(--display);font-size:22px;font-weight:800}
.rec-ring small{position:absolute;bottom:13px;font-family:var(--mono);font-size:8.5px;color:var(--muted)}
.hstats{display:grid;grid-template-columns:repeat(auto-fit,minmax(70px,1fr));gap:8px}
.hstat{background:var(--surface-2);border-radius:12px;padding:8px 10px;display:flex;flex-direction:column}
.hstat b{font-family:var(--display);font-size:17px;font-variant-numeric:tabular-nums}
.hstat span{font-size:11px;color:var(--muted)}
.ready-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}
.insights{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px}
.insights li{display:grid;grid-template-columns:18px 1fr;gap:8px;font-size:14px}
.insights li::before{content:"◆";color:var(--accent);font-size:11px;line-height:1.9}
code.url{display:block;font-family:var(--mono);font-size:11px;background:var(--surface-2);border-radius:10px;padding:8px;word-break:break-all;user-select:all;-webkit-user-select:all}
/* calendar */
.cal-head{display:flex;justify-content:space-between;align-items:center;gap:8px}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal .wd{font-family:var(--mono);font-size:9.5px;text-align:center;color:var(--muted);text-transform:uppercase;padding-bottom:2px}
.cd{position:relative;aspect-ratio:1;border-radius:12px;border:1px solid transparent;background:rgba(255,255,255,.025);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:0;font-family:var(--display);font-size:13px;font-weight:600;color:var(--muted);min-height:38px}
.cd.has{color:var(--ink);background:var(--surface-2)}
.cd.today{border-color:var(--accent)}
.cd.sel{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.cd .dots{display:flex;gap:2px;height:6px}
.cd .dots i{width:6px;height:6px;border-radius:50%}
.ds{background:var(--volt)}.df{background:var(--accent)}.dh{background:var(--xp)}
.cd .rb{position:absolute;left:22%;right:22%;bottom:3px;height:2px;border-radius:1px;opacity:.8}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px}
/* strength + moved */
.tier-hero{display:flex;flex-direction:column;gap:6px}
.tier-name{font-family:var(--display);font-size:28px;font-weight:800;text-transform:uppercase;letter-spacing:-.02em}
.t0{color:var(--muted)}.t1{color:#C7D2E0}.t2{color:var(--accent)}.t3{color:var(--volt)}.t4{color:var(--xp)}.t5{color:#FFD166}
.chip.tier{background:rgba(255,255,255,.06)}
.tscale{position:relative;height:10px;border-radius:5px;background:rgba(255,255,255,.08);overflow:hidden}
.tscale i{position:absolute;inset:0 auto 0 0;background:linear-gradient(90deg,#C7D2E0,var(--accent),var(--volt),var(--xp),#FFD166);border-radius:5px}
.tscale span{position:absolute;top:0;bottom:0;width:2px;background:var(--bg)}
.tlabels{display:flex;justify-content:space-between;font-family:var(--mono);font-size:9.5px;color:var(--muted);text-transform:uppercase}
.tier-meter{display:block;height:4px;border-radius:2px;background:rgba(255,255,255,.08);margin-top:5px;overflow:hidden}
.tier-meter i{display:block;height:100%;background:var(--accent)}
.moved{display:grid;grid-template-columns:56px minmax(0,1fr);gap:12px;align-items:center;border:1px solid var(--line);border-radius:18px;padding:10px;background:linear-gradient(120deg,rgba(204,255,0,.07),transparent 70%)}
.moved-ic{width:56px;height:56px;border-radius:16px;background:var(--volt-soft);color:var(--volt);display:grid;place-items:center}
.moved-ic svg{width:34px;height:34px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.moved-t{min-width:0;display:flex;flex-direction:column;gap:1px}
.moved-t b{font-family:var(--display);font-size:20px}
.bm-row{display:grid;grid-template-columns:112px minmax(0,1fr);gap:14px;align-items:center}
.bodymap{width:112px;height:auto}
.bodymap .bm{stroke:var(--volt);stroke-width:12;stroke-linecap:round;fill:none}
/* chrome */
#tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:rgba(11,13,19,.88);-webkit-backdrop-filter:blur(24px);backdrop-filter:blur(24px);border-top:1px solid var(--line);
  padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px));display:flex;justify-content:center}
#tabs .inner{display:grid;grid-template-columns:repeat(5,1fr);max-width:560px;width:100%;gap:4px}
#tabs a{display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 2px;border-radius:14px;text-decoration:none;color:var(--muted);font-family:var(--mono);font-size:9.5px;letter-spacing:.06em;text-transform:uppercase;font-weight:600;min-height:50px}
#tabs svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
#tabs a[aria-current="page"]{color:var(--accent);background:var(--accent-soft)}
#timer{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(78px + env(safe-area-inset-bottom,0px));z-index:21;background:var(--surface-2);color:var(--ink);border:1px solid var(--accent-line);border-radius:999px;padding:10px 18px;font-family:var(--display);font-size:19px;font-weight:600;display:flex;gap:12px;align-items:center;box-shadow:var(--shadow);white-space:nowrap;font-variant-numeric:tabular-nums}
#timer.ready{background:var(--good);color:var(--on-good);border-color:var(--good)}
#timer.hold{background:var(--accent);color:var(--accent-ink)}
#timer small{font-family:var(--body);font-size:12px;opacity:.85;font-weight:500}
#toast{position:fixed;left:50%;transform:translateX(-50%);top:calc(12px + env(safe-area-inset-top,0px));z-index:130;background:var(--surface-2);color:var(--ink);border:1px solid var(--line-2);border-radius:999px;padding:10px 16px;font-size:14px;font-weight:600;box-shadow:var(--shadow);max-width:calc(100% - 32px)}
@media (prefers-reduced-motion:no-preference){#toast{animation:drop .2s ease-out}@keyframes drop{from{transform:translate(-50%,-8px);opacity:0}}}

/* standalone page reset (the artifact host supplied this before) */
:root{padding-top:env(safe-area-inset-top,0px)}
body{margin:0;-webkit-tap-highlight-color:transparent}
img{max-width:100%}
[hidden]{display:none!important}
</style>

<script>
'use strict';
/* ================= utilities ================= */
const KEY='setbyset.v2', KEY1='setbyset.v1', BAK='setbyset.v2.backup', DAY=864e5;
const uid=()=>Math.random().toString(36).slice(2,9)+(Date.now()%1e7).toString(36);
const clone=o=>JSON.parse(JSON.stringify(o));
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num=v=>(v===''||v==null||Number.isNaN(+v))?null:+v;
const r2=v=>Math.round(v*100)/100;
const r1=v=>Math.round(v*10)/10;
const sum=a=>a.reduce((x,y)=>x+(+y||0),0);
const max=a=>a.length?Math.max(...a):0;
const fmtN=v=>v==null?'':String(r2(v));
const fmtK=v=>Math.round(v).toLocaleString();
const roundTo=(v,inc)=>r2(Math.round(v/inc)*inc);
const sod=ts=>{const d=new Date(ts);d.setHours(0,0,0,0);return d.getTime()};
const weekStart=ts=>{const d=new Date(sod(ts));d.setDate(d.getDate()-((d.getDay()+6)%7));return d.getTime()};
const ago=ts=>{const d=Math.round((sod(Date.now())-sod(ts))/DAY);return d<=0?'today':d===1?'yesterday':d+' days ago'};
const fmtDate=ts=>new Date(ts).toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric'});
const fmtShort=ts=>new Date(ts).toLocaleDateString(undefined,{month:'short',day:'numeric'});
const fmtTime=ts=>new Date(ts).toLocaleTimeString(undefined,{hour:'numeric',minute:'2-digit'});
const fmtDur=sec=>{sec=Math.max(0,Math.round(sec));return Math.floor(sec/60)+':'+String(sec%60).padStart(2,'0')};
const plural=(n,w)=>`${n} ${w}${n===1?'':'s'}`;
function rng(seed){let a=seed>>>0;return()=>{a=(a+0x6D2B79F5)>>>0;let t=a;t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return((t^t>>>14)>>>0)/4294967296}}

/* ================= figure animation ================= */
const GY=90, FL={t:28,n:8,ua:13,fa:12,th:19,sh:19,ft:5};
const dv=a=>{const r=a*Math.PI/180;return [Math.sin(r),Math.cos(r)]};
const mv=(P,a,len,mx=1)=>{const d=dv(a);return [P[0]+d[0]*len*mx,P[1]+d[1]*len]};
const lerp=(a,b,u)=>a+(b-a)*u, sm=u=>u*u*(3-2*u);
function nf(f,v){const o=Object.assign({t:180,lift:0},f);o.a1=f.a1||f.a||[0,0];o.a2=f.a2||f.a||[0,0];o.l1=f.l1||f.l||[0,0];o.l2=f.l2||f.l||[0,0];o.f1=f.f1??f.f??90;o.f2=f.f2??f.f??90;o.n=f.n??(v==='front'?180:o.t);delete o.a;delete o.l;delete o.f;return o}
function lerpPose(p,q,u){const o={};for(const k in p)o[k]=Array.isArray(p[k])?p[k].map((v,i)=>lerp(v,q[k][i],u)):lerp(p[k],q[k],u);return o}
function poseAt(A,ph,opt){const F=A.F,N=F.length;if(N===1)return F[0];
  if(A.mode==='hold'){const E=F[0],P=F[1],B=F[2];if(opt&&opt.hold)return lerpPose(P,B,(1-Math.cos(2*Math.PI*ph))/2);
    const u=((ph%1)+1)%1;if(u<0.22)return lerpPose(E,P,sm(u/0.22));if(u<0.8)return lerpPose(P,B,(1-Math.cos(4*Math.PI*(u-0.22)/0.58))/2);if(u<0.94)return lerpPose(P,E,sm((u-0.8)/0.14));return E}
  const seq=A.mode==='loop'?F.map((_,i)=>i):[...F.map((_,i)=>i),...F.slice(1,-1).map((_,i)=>N-2-i)];
  const x=(((ph%1)+1)%1)*seq.length,i=Math.floor(x)%seq.length,u=x-Math.floor(x);
  return lerpPose(F[seq[i]],F[seq[(i+1)%seq.length]],sm(Math.min(1,Math.max(0,(u-0.12)/0.76))))}
function solveFig(p,v){
  const H=[0,0],S=mv(H,p.t,FL.t),J={v,H,S,hd:mv(S,p.n,FL.n)};
  if(v==='front'){
    const d=dv(p.t),r=[-d[1],d[0]],off=(P,k)=>[P[0]+r[0]*k,P[1]+r[1]*k];
    J.RS=off(S,8);J.LS=off(S,-8);J.RH=off(H,5);J.LH=off(H,-5);
    J.E1=mv(J.RS,p.a1[0],FL.ua);J.W1=mv(J.E1,p.a1[1],FL.fa);J.E2=mv(J.LS,p.a2[0],FL.ua,-1);J.W2=mv(J.E2,p.a2[1],FL.fa,-1);
    J.K1=mv(J.RH,p.l1[0],FL.th);J.A1=mv(J.K1,p.l1[1],FL.sh);J.T1=[J.A1[0]+4,J.A1[1]];
    J.K2=mv(J.LH,p.l2[0],FL.th,-1);J.A2=mv(J.K2,p.l2[1],FL.sh,-1);J.T2=[J.A2[0]-4,J.A2[1]];
  }else{
    J.E1=mv(S,p.a1[0],FL.ua);J.W1=mv(J.E1,p.a1[1],FL.fa);J.E2=mv(S,p.a2[0],FL.ua);J.W2=mv(J.E2,p.a2[1],FL.fa);
    J.K1=mv(H,p.l1[0],FL.th);J.A1=mv(J.K1,p.l1[1],FL.sh);J.T1=mv(J.A1,p.l1[1]+p.f1,FL.ft);
    J.K2=mv(H,p.l2[0],FL.th);J.A2=mv(J.K2,p.l2[1],FL.sh);J.T2=mv(J.A2,p.l2[1]+p.f2,FL.ft);
  }
  return J;
}
const GP=['E1','W1','E2','W2','K1','A1','T1','K2','A2','T2'];
const ALLP=['H','S','hd','E1','W1','E2','W2','K1','A1','T1','K2','A2','T2','RS','LS','RH','LH'];
function lowY(J){let m=Math.max(J.H[1]+3,J.S[1]+3);GP.forEach(k=>{if(J[k][1]>m)m=J[k][1]});return m}
function anchorPt(A,J){const a=A.anchor;if(a==='hip')return J.H;if(a==='hand'||a==='handg')return J.W1;if(a==='foot2')return J.A2;if(J.v==='front')return [(J.A1[0]+J.A2[0])/2,0];return J.A1}
function placeRaw(A,ph,cx,opt){const p=poseAt(A,ph,opt),J=solveFig(p,A.v),ap=anchorPt(A,J);
  if(A.fixH){if(A._hy==null){const J0=solveFig(A.F[0],A.v);A._hy=GY-lowY(J0)+J0.H[1]}return {J,dx:cx-ap[0],dy:A._hy-J.H[1]-p.lift}}
  return {J,dx:cx-ap[0],dy:A.anchor==='hand'?(A.handY||14)-J.W1[1]:GY-lowY(J)-p.lift}}
function shiftJ(J,dx,dy,s,cy){const o={v:J.v};ALLP.forEach(k=>{if(J[k])o[k]=[60+(J[k][0]+dx-60)*s,cy+(J[k][1]+dy-cy)*s]});return o}
function prepAnim(A){
  if(A.F)return;
  A.F=A.frames.map(f=>nf(f,A.v));
  let x0=1e9,x1=-1e9,y0=1e9,y1=-1e9;
  for(let i=0;i<20;i++){const {J,dx,dy}=placeRaw(A,i/20,0);ALLP.forEach(k=>{if(!J[k])return;const x=J[k][0]+dx,y=J[k][1]+dy;x0=Math.min(x0,x);x1=Math.max(x1,x);y0=Math.min(y0,y-(k==='hd'?6:0));y1=Math.max(y1,y)})}
  A.cx=60-(x0+x1)/2;A.cy=A.anchor==='hand'?(A.handY||14):GY;
  const h=A.anchor==='hand'?(y1-y0+10):(GY-y0+6);
  A.s=Math.min(1,104/(x1-x0+12),86/h);
  A.fix=place(A,A.mode==='hold'?0.5:0);
  const xs=ALLP.filter(k=>A.fix[k]).map(k=>A.fix[k][0]);A.fix.minX=Math.min(...xs);A.fix.maxX=Math.max(...xs);
}
function place(A,ph,opt){const {J,dx,dy}=placeRaw(A,ph,A.cx,opt);return shiftJ(J,dx,dy,A.s,A.cy)}
const f1=n=>n.toFixed(1);
const ln=(a,b,c)=>`<line class="${c}" x1="${f1(a[0])}" y1="${f1(a[1])}" x2="${f1(b[0])}" y2="${f1(b[1])}"/>`;
const pl=(pts,c)=>`<polyline class="${c}" points="${pts.map(p=>f1(p[0])+','+f1(p[1])).join(' ')}"/>`;
const ci=(c,r,cl)=>`<circle class="${cl}" cx="${f1(c[0])}" cy="${f1(c[1])}" r="${f1(r)}"/>`;
function benchShape(x1,x2,y){return `<rect class="pbf" x="${f1(x1)}" y="${f1(y)}" width="${f1(x2-x1)}" height="3.4" rx="1.2"/>`+ln([x1+3,y],[x1+3,GY+2],'pb')+ln([x2-3,y],[x2-3,GY+2],'pb')}
function segOf(J,k){
  const fr=J.v==='front',S1=fr?J.RS:J.S,S2=fr?J.LS:J.S,H1=fr?J.RH:J.H,H2=fr?J.LH:J.H,Lp=(a,b,u)=>[a[0]+(b[0]-a[0])*u,a[1]+(b[1]-a[1])*u];
  switch(k){case 'trunk':return [J.H,J.S];case 'chest':return [J.S,Lp(J.S,J.H,.45)];case 'abs':return [Lp(J.S,J.H,.35),J.H];case 'neck':return [J.S,J.hd];
    case 'ua1':return [S1,J.E1];case 'ua2':return [S2,J.E2];case 'fa1':return [J.E1,J.W1];case 'fa2':return [J.E2,J.W2];
    case 'delt1':return [S1,Lp(S1,J.E1,.55)];case 'delt2':return [S2,Lp(S2,J.E2,.55)];
    case 'th1':return [H1,J.K1];case 'th2':return [H2,J.K2];case 'sh1':return [J.K1,J.A1];case 'sh2':return [J.K2,J.A2];
    case 'glute1':return [H1,Lp(H1,J.K1,.4)];case 'glute2':return [H2,Lp(H2,J.K2,.4)]}
  return null;
}
function figInner(key,ph,opt){
  const A=ANIM[key]||ANIM.mountain;prepAnim(A);
  const J=place(A,ph,opt),F=A.fix,s=A.s,P=k=>(A.props||[]).includes(k);
  let back='',front='';
  if(P('bar')){const y=F.W1[1];back+=ln([14,y],[106,y],'pb')+ln([16,y],[16,GY+2],'pb')+ln([104,y],[104,GY+2],'pb')}
  if(P('bench')){const x1=Math.min(J.S[0],J.H[0])-6*s,x2=Math.max(J.S[0],J.H[0])+7*s;back+=benchShape(x1,x2,Math.max(J.S[1],J.H[1])+3.6*s)}
  if(P('benchHand'))back+=benchShape(J.W1[0]-17*s,J.W1[0]+4*s,J.W1[1]+2.6*s);
  if(P('seat'))back+=benchShape(J.H[0]-13*s,J.H[0]+8*s,J.H[1]+3.6*s);
  if(P('wallB')){const x=F.minX-4;back+=ln([x,8],[x,GY+2],'pb')}
  if(P('wallF')){const x=F.maxX+4;back+=ln([x,8],[x,GY+2],'pb')}
  const pul={cableH:[F.maxX+12,10],cableM:[F.maxX+12,F.S[1]+4],cableL:[F.maxX+12,GY-6],cableU:[F.W1[0],5]};
  for(const k in pul)if(P(k))back+=ln(pul[k],J.W1,'pl')+ci(pul[k],2.6,'p');
  if(P('cableX'))back+=ln([8,12],J.W2,'pl')+ln([112,12],J.W1,'pl')+ci([8,12],2.6,'p')+ci([112,12],2.6,'p');
  if(P('bandB'))back+=ln([F.minX-8,F.S[1]+6],J.W1,'bd');
  if(P('bandF'))front+=ln(J.W1,J.W2,'bd');
  if(P('bandK'))front+=ln(J.K1,J.K2,'bd');
  if(P('bandL')){front+=ln(J.A1,J.W1,'bd');if(J.v==='front')front+=ln(J.A2,J.W2,'bd')}
  if(P('bandFoot'))front+=ln(J.T1,J.W1,'bd');

    if(st.top>b.load)out.push({label:'Heaviest',value:`${st.top} ${u} × ${byL[String(st.top)]}`});
    for(const [Lo,r] of Object.entries(byL))if(b.repsAt[Lo]!=null&&r>b.repsAt[Lo])out.push({label:`Most reps at ${Lo} ${u}`,value:`${r}`});
    if(b.vol>0&&st.vol>b.vol)out.push({label:'Volume',value:`${fmtK(st.vol)} ${db.unit}`});

function itemSec(ex,it){

function card(s,e,mode){

const cmp=(a,b)=>a>b*1.01?'improved':a<b*0.99?'declined':'maintained';
function analyze(ex,st,pst,e,status){
  const m=model(ex),u=loadCap(ex),out=[],t=e.target||{};
  if(!pst)out.push('First time. Baseline set.');
  else if(loadish(ex)){if(st.top>pst.top)out.push(`Up to ${st.top} ${u} from ${pst.top}.`);else if(st.top<pst.top)out.push(`${st.top} ${u}, down from ${pst.top}.`);else{const d=st.totalReps-pst.totalReps;out.push(d>0?`+${d} rep${d===1?'':'s'} vs last time.`:d<0?`${d} reps vs last time.`:'Same reps as last time.')}}
  else if(m==='bw'){const d=st.totalReps-pst.totalReps;out.push(d>0?`+${d} rep${d===1?'':'s'} vs last time.`:d<0?`${d} reps vs last time.`:'Same reps as last time.')}
  else if(m==='time'){const d=st.total-pst.total;out.push(d>0?`+${d} s vs last time.`:d<0?`${d} s vs last time.`:'Same time as last time.')}
  else{const d=r1(st.dur-pst.dur);out.push(d>0?`+${d} min vs last time.`:d<0?`${d} min vs last time.`:'Same duration.')}
  if((loadish(ex)||m==='bw')&&t.repMax&&st.n>=(t.sets||1)&&st.reps.slice(0,t.sets||1).every(r=>r>=t.repMax))out.push(`Top of range (${t.repMax}) on every set.`);
  if(st.pain)out.push(`Pain ${st.pain}/10 noted. Next target holds back.`);
  if(e.skipped)out.push(`${plural(e.skipped,'set')} skipped.`);
  return out;
}

}

function cropTo(src,sw,sh,mirror){
  const ratio=.75;let cw,ch,sx,sy;if(sw/sh>ratio){ch=sh;cw=sh*ratio;sx=(sw-cw)/2;sy=0}else{cw=sw;ch=sw/ratio;sx=0;sy=(sh-ch)/2}
  const H=Math.min(1440,Math.round(ch)),W=Math.round(H*ratio),cv=document.createElement('canvas');cv.width=W;cv.height=H;const x=cv.getContext('2d');
  if(mirror){x.translate(W,0);x.scale(-1,1)}x.drawImage(src,sx,sy,cw,ch,0,0,W,H);return cv;
}
